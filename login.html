<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Admin Login – MyShop</title>
  <!-- Google Fonts: Inter -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet"/>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>
  <style>
    :root {
      --bg-main: #0b0c10;
      --bg-card: rgba(255, 255, 255, 0.03);
      --border-color: rgba(255, 255, 255, 0.08);
      --color-primary: #6366f1;
      --color-primary-glow: rgba(99, 102, 241, 0.2);
      --color-danger: #ef4444;
      --color-danger-glow: rgba(239, 68, 68, 0.1);
      --text-main: #f3f4f6;
      --text-muted: #9ca3af;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Inter', sans-serif;
    }

    body {
      background-color: var(--bg-main);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
    }

    /* Ambient Background Glows */
    .ambient-bg {
      position: absolute;
      inset: 0;
      z-index: -1;
      background: 
        radial-gradient(ellipse at 20% 30%, rgba(99, 102, 241, 0.12) 0%, transparent 60%),
        radial-gradient(ellipse at 80% 70%, rgba(139, 92, 246, 0.08) 0%, transparent 60%);
      pointer-events: none;
    }

    /* Floating card container */
    .card {
      position: relative;
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 24px;
      padding: 48px 40px;
      width: 400px;
      max-width: 90%;
      backdrop-filter: blur(20px);
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
      transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275), border-color 0.3s;
    }

    .card:hover {
      border-color: rgba(255, 255, 255, 0.12);
    }

    /* Header & Branding */
    .logo-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      margin-bottom: 36px;
    }

    .icon-wrapper {
      width: 64px;
      height: 64px;
      background: linear-gradient(135deg, var(--color-primary), #8b5cf6);
      border-radius: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      color: #fff;
      margin-bottom: 16px;
      box-shadow: 0 8px 16px var(--color-primary-glow);
      animation: float 4s ease-in-out infinite;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-6px); }
    }

    .logo-container h1 {
      font-size: 24px;
      font-weight: 800;
      letter-spacing: -0.5px;
      background: linear-gradient(135deg, #fff, #9ca3af);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .logo-container p {
      color: var(--text-muted);
      font-size: 13px;
      margin-top: 6px;
    }

    /* Error Alert */
    .error-box {
      background: var(--color-danger-glow);
      border: 1px solid rgba(239, 68, 68, 0.3);
      color: #f87171;
      border-radius: 12px;
      padding: 12px 16px;
      font-size: 13px;
      font-weight: 500;
      margin-bottom: 24px;
      display: none;
      align-items: center;
      gap: 10px;
      animation: fadeIn 0.3s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-5px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Form Fields */
    .form-group {
      margin-bottom: 24px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .form-group label {
      display: block;
      color: var(--text-muted);
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .input-wrapper {
      position: relative;
      width: 100%;
    }

    .input-wrapper i.field-icon {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
      font-size: 14px;
    }

    .input-wrapper input {
      width: 100%;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 14px 44px 14px 40px;
      color: #fff;
      font-size: 14px;
      outline: none;
      transition: all 0.2s ease;
    }

    .input-wrapper input:focus {
      border-color: var(--color-primary);
      background: rgba(255, 255, 255, 0.06);
      box-shadow: 0 0 0 3px var(--color-primary-glow);
    }

    .input-wrapper .toggle-pwd {
      position: absolute;
      right: 14px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      font-size: 14px;
      padding: 4px;
      transition: color 0.2s;
    }

    .input-wrapper .toggle-pwd:hover {
      color: #fff;
    }

    /* Sign In Button */
    .btn {
      width: 100%;
      background: linear-gradient(135deg, var(--color-primary), #8b5cf6);
      border: none;
      border-radius: 12px;
      padding: 14px;
      color: #fff;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.25s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .btn:hover {
      background: linear-gradient(135deg, #7477f8, #9a6ffa);
      box-shadow: 0 8px 24px rgba(99, 102, 241, 0.3);
      transform: translateY(-1px);
    }

    .btn:active {
      transform: translateY(0);
    }

    .btn:disabled {
      opacity: 0.65;
      cursor: not-allowed;
      transform: none !important;
      box-shadow: none !important;
    }

    /* Loading Spinner */
    .spinner {
      display: none;
      width: 18px;
      height: 18px;
      border: 2px solid rgba(255, 255, 255, 0.3);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* Error Shake Animation */
    .shake {
      animation: shake 0.4s ease-in-out;
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-8px); }
      40%, 80% { transform: translateX(8px); }
    }
  </style>
</head>
<body>
  <div class="ambient-bg"></div>

  <div class="card" id="login-card">
    <div class="logo-container">
      <div class="icon-wrapper">
        <i class="fa-solid fa-shop"></i>
      </div>
      <h1>MyShop Admin</h1>
      <p>Sign in to your administration dashboard</p>
    </div>

    <div class="error-box" id="err">
      <i class="fa-solid fa-circle-exclamation"></i>
      <span>Invalid admin secret key.</span>
    </div>

    <div class="form-group">
      <label for="key">Admin Secret Key</label>
      <div class="input-wrapper">
        <i class="fa-solid fa-lock field-icon"></i>
        <input type="password" id="key" placeholder="Enter your key" autocomplete="current-password"/>
        <button type="button" class="toggle-pwd" onclick="togglePasswordVisibility()" title="Toggle Visibility">
          <i class="fa-regular fa-eye" id="toggle-icon"></i>
        </button>
      </div>
    </div>

    <button class="btn" id="login-btn" onclick="login()">
      <span id="btn-text">Sign In</span>
      <i class="fa-solid fa-arrow-right-to-bracket" id="btn-arrow"></i>
      <div class="spinner" id="btn-spinner"></div>
    </button>
  </div>

  <script>
    // Dynamic API Base URL depending on where this page is hosted
    const API_BASE = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1'
      ? '' 
      : 'https://backend-telegram-bot.onrender.com'; // Replace this with your actual Render backend URL

    // Submit on Enter keypress
    document.getElementById('key').addEventListener('keydown', e => {
      if (e.key === 'Enter') login();
    });

    // Password field visibility toggle
    function togglePasswordVisibility() {
      const input = document.getElementById('key');
      const icon = document.getElementById('toggle-icon');
      if (input.type === 'password') {
        input.type = 'text';
        icon.className = 'fa-regular fa-eye-slash';
      } else {
        input.type = 'password';
        icon.className = 'fa-regular fa-eye';
      }
    }

    async function login() {
      const input = document.getElementById('key');
      const card = document.getElementById('login-card');
      const errBox = document.getElementById('err');
      const btn = document.getElementById('login-btn');
      const btnText = document.getElementById('btn-text');
      const btnArrow = document.getElementById('btn-arrow');
      const btnSpinner = document.getElementById('btn-spinner');

      const key = input.value.trim();
      if (!key) return;

      // Reset error state
      card.classList.remove('shake');
      errBox.style.display = 'none';

      // Set Loading State
      input.disabled = true;
      btn.disabled = true;
      btnText.textContent = 'Authenticating...';
      btnArrow.style.display = 'none';
      btnSpinner.style.display = 'block';

      try {
        const res = await fetch(API_BASE + '/admin/api/stats?key=' + encodeURIComponent(key));
        if (res.ok) {
          sessionStorage.setItem('adminKey', key);
          location.href = '/admin';
        } else {
          throw new Error();
        }
      } catch (e) {
        // Reset state & show error
        input.disabled = false;
        btn.disabled = false;
        btnText.textContent = 'Sign In';
        btnArrow.style.display = 'block';
        btnSpinner.style.display = 'none';
        
        errBox.style.display = 'flex';
        card.classList.add('shake');
        input.focus();
      }
    }
  </script>
</body>
</html>
